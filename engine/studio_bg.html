<!doctype html><html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#05201E}
.l{position:absolute}
#wall{inset:0;background:radial-gradient(ellipse 70% 45% at 50% 42%,#11524C 0%,#0A3532 45%,#051C1A 80%,#030F0E 100%)}
#hex{left:540px;top:820px;width:980px;height:1132px;margin:-566px 0 0 -490px;opacity:.16}
#floor{left:0;right:0;top:1380px;bottom:0;background:linear-gradient(180deg,#0B2F2C 0%,#061918 60%,#030C0B 100%)}
#horizon{left:0;right:0;top:1376px;height:8px;background:linear-gradient(90deg,transparent,rgba(251,176,27,.35),transparent);filter:blur(3px)}
#pool{left:540px;top:1520px;width:1100px;height:300px;margin:-150px 0 0 -550px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,226,170,.42),rgba(255,200,120,.12) 45%,transparent 70%)}
.beam{top:-80px;width:520px;height:1600px;transform-origin:50% 0;background:linear-gradient(180deg,rgba(255,236,200,.38),rgba(255,220,160,.10) 55%,transparent 85%);clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);filter:blur(14px);mix-blend-mode:screen}
.lamp{top:-30px;width:150px;height:70px;border-radius:0 0 75px 75px;background:#0E1413;box-shadow:inset 0 -14px 0 #FFE9BF,0 30px 70px rgba(255,220,150,.75)}
.soft{width:250px;height:420px;border-radius:14px;background:linear-gradient(180deg,#FFF8E8,#FFE6B5);box-shadow:0 0 90px 30px rgba(255,214,140,.55),0 0 240px 80px rgba(255,190,90,.22);border:10px solid #121A19}
.stand{width:10px;background:linear-gradient(180deg,#1B2423,#0B1110)}
.leg{height:10px;background:#0B1110;transform-origin:50% 50%}
.dot{border-radius:50%;background:radial-gradient(circle,rgba(255,236,200,.9),rgba(255,236,200,0) 70%)}
#logo{right:60px;top:80px;height:110px;background:rgba(255,255,255,.92);padding:14px 22px;border-radius:22px;box-sizing:content-box}
#vig{inset:0;background:radial-gradient(ellipse 85% 70% at 50% 50%,transparent 55%,rgba(0,0,0,.6) 100%)}
#rim{left:540px;top:900px;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;background:radial-gradient(circle,rgba(25,181,166,.28),transparent 65%)}
</style></head><body>
<div class="l" id="wall"></div>
<svg class="l" id="hex" viewBox="0 0 100 115.5"><g fill="none" stroke-width="5"><path d="M50 3 L95 29 L95 86.5 L50 112.5 L5 86.5 L5 29 Z" stroke="#FBB01B"/><path d="M50 18 L82 36.5 L82 79 L50 97.5 L18 79 L18 36.5 Z" stroke="#19B5A6" stroke-width="3"/></g></svg>
<div class="l" id="rim"></div>
<div class="l beam" id="b1" style="left:60px"></div>
<div class="l beam" id="b2" style="left:500px"></div>
<div class="l lamp" style="left:250px"></div>
<div class="l lamp" style="left:690px"></div>
<div class="l" id="floor"></div>
<div class="l" id="horizon"></div>
<div class="l" id="pool"></div>
<!-- softboxes on stands, left and right -->
<div class="l stand" style="left:150px;top:1080px;height:420px"></div>
<div class="l leg" style="left:85px;top:1495px;width:140px;transform:rotate(-12deg)"></div><div class="l leg" style="left:85px;top:1495px;width:140px;transform:rotate(12deg)"></div>
<div class="l soft" id="s1" style="left:30px;top:700px;transform:perspective(900px) rotateY(32deg)"></div>
<div class="l stand" style="left:920px;top:1080px;height:420px"></div>
<div class="l leg" style="left:855px;top:1495px;width:140px;transform:rotate(-12deg)"></div><div class="l leg" style="left:855px;top:1495px;width:140px;transform:rotate(12deg)"></div>
<div class="l soft" id="s2" style="left:800px;top:700px;transform:perspective(900px) rotateY(-32deg)"></div>
<div id="dots"></div>
<img class="l" id="logo" src="logo_h.png" alt="">
<div class="l" id="vig"></div>
<script>
const D=document.getElementById('dots');const P=[];let seed=7;const r=()=>(seed=(seed*16807)%2147483647)/2147483647;
for(let i=0;i<34;i++){const e=document.createElement('div');e.className='l dot';const s=10+r()*46;e.style.width=e.style.height=s+'px';D.appendChild(e);P.push({e,x:r()*1080,y:r()*1500,s,v:6+r()*16,ph:r()*6.28,a:.15+r()*.45});}
window.render=function(t){
 document.getElementById('b1').style.transform=`rotate(${-14+Math.sin(t*.35)*3}deg)`;
 document.getElementById('b2').style.transform=`rotate(${14+Math.sin(t*.3+1.3)*3}deg)`;
 const f=.92+.08*Math.sin(t*1.7)*Math.sin(t*.6);document.getElementById('s1').style.opacity=f;document.getElementById('s2').style.opacity=.94+.06*Math.sin(t*1.3+2);
 document.getElementById('pool').style.opacity=.85+.15*Math.sin(t*.8);
 document.getElementById('hex').style.transform=`rotate(${t*1.2}deg) scale(${1+Math.sin(t*.4)*.02})`;
 P.forEach(p=>{const y=((p.y-t*p.v)%1500+1500)%1500;p.e.style.transform=`translate(${p.x+Math.sin(t*.5+p.ph)*20}px,${y}px)`;p.e.style.opacity=p.a*(.6+.4*Math.sin(t*1.1+p.ph));});
};
render(0);
</script></body></html>
