<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Thm;font-weight:900;src:url(fonts/thmanyah-black.otf)}
@font-face{font-family:Thm;font-weight:700;src:url(fonts/thmanyah-bold.otf)}
@font-face{font-family:Thm;font-weight:500;src:url(fonts/thmanyah-medium.otf)}
:root{--teal:#0a6660;--teal2:#0a8f84;--amber:#fbb01b;--orange:#f47c20;--green:#4f8f3e;--ink:#0d3b38;--paper:#ffffff}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;position:relative;background:var(--paper);font-family:Thm,sans-serif;color:var(--ink)}
#pattern{position:absolute;inset:-200px;opacity:.04}
#head{position:absolute;top:70px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:26px;direction:rtl}
#head img{width:560px;display:block}
#tag{font:700 42px Thm;color:#fff;background:var(--teal);padding:8px 40px;border-radius:60px}
.layer{direction:rtl;position:absolute;left:0;right:0;top:400px;bottom:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 80px;text-align:center}
.hook{font:900 130px/1.55 Thm;color:var(--ink)}
.hook .ln{display:block;width:max-content;margin:0 auto;white-space:nowrap;line-height:1.5}
.hook .ln:first-child{color:var(--teal)}
.mk{background-image:linear-gradient(transparent 58%,var(--amber) 58%,var(--amber) 92%,transparent 92%);background-repeat:no-repeat;background-position:right bottom;background-size:calc(var(--s,1)*100%) 100%;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 12px}
.hex{position:relative;width:330px;height:370px;display:flex;align-items:center;justify-content:center;margin-bottom:46px}
.hex svg{position:absolute;inset:0;width:100%;height:100%}
.hex .em{font-size:150px;font-family:"Noto Color Emoji",sans-serif;position:relative}
.big{font:900 170px/1.15 Thm;color:var(--orange);unicode-bidi:plaintext;margin-bottom:20px}
.fact{font:900 92px/1.6 Thm;color:var(--ink)}
.fact .fl{display:block;width:max-content;margin:0 auto;white-space:nowrap}
.fact .w{display:inline-block;margin:0 8px}
.fact .hl{color:var(--teal2)}
.card{background:#fff;border-radius:44px;box-shadow:0 30px 80px rgba(13,59,56,.16);padding:60px 56px;width:920px;border-top:16px solid var(--amber)}
.row div:last-child{text-wrap:balance}
.row{display:flex;align-items:center;gap:30px;text-align:right;font:700 70px/1.55 Thm;color:var(--ink);padding:22px 0}
.row+.row{border-top:3px dashed #e3ded1}
.row .i{flex:none;width:86px;height:86px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:900 54px Thm;color:#fff}
.i.ok{background:var(--teal2)}.i.no{background:var(--orange)}.i.dot{background:var(--amber)}
.row b{color:var(--orange);font-weight:900}
.cta-logo{width:880px;margin-bottom:80px}
.cta-logo img{width:100%;display:block}
.cta1{font:900 100px/1.45 Thm;color:var(--ink);text-wrap:balance}
.btn{margin-top:50px;background:var(--teal);color:#fff;font:900 58px Thm;padding:22px 70px;border-radius:80px;direction:ltr;box-shadow:0 14px 40px rgba(10,102,96,.35)}
#foot{position:absolute;bottom:0;left:0;right:0;height:150px;background:var(--ink);display:flex;align-items:center;justify-content:center;font:700 44px Thm;color:#fff;direction:rtl;gap:16px}
#foot b{color:var(--amber);direction:ltr}
.rowh{font:900 66px Thm;color:var(--teal);text-align:right;padding-bottom:14px}
.wp{position:absolute;top:-5%;bottom:-5%;left:0;width:120%;z-index:50;display:flex;align-items:center;justify-content:center}
#w1{background:var(--amber)}#w2{background:linear-gradient(135deg,var(--teal),var(--teal2))}#w3{background:#fff}
#w3 img{width:700px;transform:skewX(14deg)}
#bar{position:absolute;bottom:150px;right:0;height:16px;background:linear-gradient(270deg,var(--teal2),var(--amber),var(--orange))}
</style>
</head>
<body>
<svg id="pattern" width="1480" height="2320"><defs><pattern id="hp" width="120" height="208" patternUnits="userSpaceOnUse"><path d="M60 0 L120 34.6 L120 104 L60 138.6 L0 104 L0 34.6 Z M60 138.6 L60 208" fill="none" stroke="#0a6660" stroke-width="5"/></pattern></defs><rect width="100%" height="100%" fill="url(#hp)"/></svg>
<div id="head"><img src="logo_h.png"><div id="tag"></div></div>

<div id="L1" class="layer"><div class="hook" id="hook"></div></div>
<div id="L2" class="layer">
  <div class="hex" id="hexw"><svg viewBox="0 0 330 370"><path d="M165 12 L312 96 L312 274 L165 358 L18 274 L18 96 Z" fill="#fff" stroke="none"/><path id="hexA" d="M165 12 L18 96 L18 274 L165 358" fill="none" stroke="#fbb01b" stroke-width="26" stroke-linejoin="round"/><path id="hexB" d="M165 12 L312 96 L312 274 L165 358" fill="none" stroke="#0a6660" stroke-width="26" stroke-linejoin="round"/></svg><div class="em" id="emoji"></div></div>
  <div class="big" id="big"></div>
  <div class="fact" id="fact"></div>
</div>
<div id="L3" class="layer"><div class="card" id="detail"></div></div>
<div id="L4" class="layer"><div class="cta-logo" id="ctaLogo"><img src="logo_h.png"></div><div class="cta1" id="cta"></div><div class="btn" id="btn">+ Follow @taras_saudi</div></div>

<div class="wp" id="w1"></div><div class="wp" id="w2"></div><div class="wp" id="w3"><img src="logo_h.png"></div>
<div id="bar"></div>
<div id="foot"><span>تابعنا</span><b>@taras_saudi</b></div>
<script>
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
let D,words=[],lines=[],rows=[],T;
const stripEmoji=s=>s;
function markHook(h){
  // first line gets the amber marker
  return h.split('<br>').map((l,i)=>`<span class="ln">${i===0?`<span class="mk">${l}</span>`:l}</span>`).join('');
}
function setup(d){
  D=d;
  document.getElementById('tag').textContent=d.tag;
  document.getElementById('hook').innerHTML=markHook(d.hook);
  lines=[...document.querySelectorAll('.hook .ln')];
  // each hook line is sized to fill the width (poster style), first line capped bigger
  lines.forEach((l,k)=>{let fs=k===0?160:120;l.style.fontSize=fs+'px';while(fs>64&&l.scrollWidth>930){fs-=4;l.style.fontSize=fs+'px';}});
  document.getElementById('emoji').textContent=d.emoji;
  const big=document.getElementById('big'); big.textContent=d.big||''; big.style.display=d.big?'':'none';
  document.getElementById('hexw').style.display=d.big?'none':'';
  let hl=false;
  const wrapW=w=>{const st=w.startsWith('*'),en=w.endsWith('*');if(st)hl=true;const c=hl?'w hl':'w';w=w.replace(/\*/g,'');if(en)hl=false;return `<span class="${c}">${w}</span>`};
  const fe=document.getElementById('fact');
  fe.innerHTML=d.fact.split('<br>').map(l=>`<span class="fl">${l.trim().split(' ').map(wrapW).join(' ')}</span>`).join('');
  let ff=92; fe.style.fontSize=ff+'px';
  while(ff>56 && Math.max(...[...fe.querySelectorAll('.fl')].map(l=>l.scrollWidth))>920){ff-=4;fe.style.fontSize=ff+'px';}
  words=[...document.querySelectorAll('.fact .w')];
  document.getElementById('detail').innerHTML=d.detail.split('<br>').map(l=>{
    l=l.trim(); if(l.endsWith(':')) return `<div class="rowh">${l}</div>`; let cls='dot',sym='•';
    if(l.startsWith('❌')){cls='no';sym='✕';l=l.slice(1).trim();}
    else if(l.startsWith('✅')){cls='ok';sym='✓';l=l.slice(1).trim();}
    return `<div class="row"><div class="i ${cls}">${sym}</div><div>${l}</div></div>`;}).join('');
  rows=[...document.querySelectorAll('.row')];
  document.getElementById('cta').innerHTML=d.cta;
  T={hook:[0,2.8],fact:[2.8,9.8],detail:[9.8,14.4],cta:[14.4,d.duration]};
}
function show(id,t,[a,b],inDur=.4){
  // hard cut hidden under the brand wipe + slow push-in while on screen
  const el=document.getElementById(id);
  const on=t>=a&&t<b;
  el.style.opacity=on?1:0;
  const i=ease((t-a)/inDur);
  el.style.transform=`scale(${1+0.025*Math.max(0,t-a)})`;
  return i;
}
const easeIO=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
function wipe(t){
  const W=[T.fact[0],T.detail[0],T.cta[0]];
  let x1=200,x2=200,x3=200;
  for(const b of W){const p=(t-(b-0.36))/0.72; if(p>0&&p<1.15){
    x3=120-300*easeIO(p); x2=120-300*easeIO(p+0.1); x1=120-300*easeIO(p+0.2);}}
  document.getElementById('w1').style.transform=`translateX(${x1}%) skewX(-14deg)`;
  document.getElementById('w2').style.transform=`translateX(${x2}%) skewX(-14deg)`;
  document.getElementById('w3').style.transform=`translateX(${x3}%) skewX(-14deg)`;
}
function render(t){
  document.getElementById('pattern').style.transform=`translateY(${-t*12}px)`;
  // hook
  show('L1',t,T.hook,.01);
  lines.forEach((l,k)=>{const s=ease((t-.1-k*.18)/.4);l.style.opacity=s;l.style.transform=`translateY(${(1-s)*70}px)`;});
  const mk=document.querySelector('.hook .mk'); if(mk) mk.style.setProperty('--s',ease((t-.7)/.45));
  // fact
  show('L2',t,T.fact,.35);
  const lt=t-T.fact[0];
  const hx=document.getElementById('hexw'); hx.style.transform=`scale(${back(lt/.55)})`;
  document.getElementById('emoji').style.transform=`translateY(${Math.sin(t*2.4)*10}px)`;
  const bg=document.getElementById('big'); bg.style.transform=`scale(${back(lt/.55)})`;
  const per=Math.min(.2,4/Math.max(words.length,1));
  words.forEach((w,k)=>{const s=clamp((lt-.6-k*per)/.25);w.style.opacity=s;w.style.transform=`translateY(${(1-ease(s))*30}px)`;});
  // detail
  show('L3',t,T.detail,.35);
  const dt=t-T.detail[0];
  document.getElementById('detail').style.transform=`translateY(${(1-ease(dt/.45))*120}px)`;
  rows.forEach((r,k)=>{const s=ease((dt-.25-k*.45)/.35);r.style.opacity=s;r.style.transform=`translateX(${(1-s)*-60}px)`;});
  // cta
  show('L4',t,T.cta,.3);
  const ct=t-T.cta[0];
  document.getElementById('ctaLogo').style.transform=`scale(${back(ct/.6)})`;
  document.getElementById('btn').style.transform=`scale(${ct>0.8?1+Math.max(0,Math.sin((ct-.8)*6))*.06:back((ct-.4)/.4)})`;
  document.getElementById('bar').style.width=(t/D.duration*100)+'%';
  wipe(t);
}
</script>
</body>
</html>
