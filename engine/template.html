<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Cairo;font-weight:900;src:url(node_modules/@fontsource/cairo/files/cairo-arabic-900-normal.woff2);unicode-range:U+0600-06FF,U+FE70-FEFF,U+0750-077F}
@font-face{font-family:Cairo;font-weight:900;src:url(node_modules/@fontsource/cairo/files/cairo-latin-900-normal.woff2);unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Cairo;font-weight:700;src:url(node_modules/@fontsource/cairo/files/cairo-latin-700-normal.woff2);unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Cairo;font-weight:700;src:url(node_modules/@fontsource/cairo/files/cairo-arabic-700-normal.woff2)}
@font-face{font-family:Tajawal;font-weight:500;src:url(node_modules/@fontsource/tajawal/files/tajawal-arabic-500-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;position:relative;background:#0b0f1a;font-family:Cairo,sans-serif;color:#fff}
#bg{position:absolute;inset:0;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(120px);opacity:.55}
#stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 90px;text-align:center}
.layer{direction:rtl;position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 90px;text-align:center}
#tag{direction:rtl;position:absolute;top:150px;right:0;left:0;text-align:center;font:700 44px Cairo;letter-spacing:1px;color:#ffd166}
#tag span{background:rgba(255,209,102,.12);border:3px solid rgba(255,209,102,.5);padding:10px 34px;border-radius:60px}
.hook{font:900 112px/1.25 Cairo;text-shadow:0 10px 40px rgba(0,0,0,.5)}
.emoji{font-size:260px;line-height:1;margin-bottom:40px;font-family:"Noto Color Emoji",sans-serif}
.big{font:900 170px/1.1 Cairo;direction:ltr;background:linear-gradient(180deg,#fff,#ffd166);-webkit-background-clip:text;color:transparent;margin-bottom:30px}
.fact{font:700 74px/1.6 Cairo;max-width:900px}
.fact .w{display:inline-block;margin:0 10px}
.hl{color:#ffd166}
.detail{font:500 58px/1.6 Tajawal;color:#d6deff;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.14);border-radius:40px;padding:50px 56px}
.detail b{font-family:Cairo;font-weight:700;color:#7ee0ff}
.cta1{font:900 96px/1.3 Cairo}
.cta2{font:700 60px Cairo;color:#ffd166;margin-top:40px;direction:ltr}
#bar{position:absolute;bottom:0;right:0;height:14px;background:linear-gradient(90deg,#7ee0ff,#ffd166)}
#handle{position:absolute;bottom:190px;left:0;right:0;text-align:center;font:700 40px Cairo;color:rgba(255,255,255,.55);direction:ltr}

.logo{position:relative;display:inline-block}
.logo svg{width:100%;height:100%;display:block}
.logo .lt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 1px Cairo;color:#ffd166;direction:rtl}
#brand{position:absolute;bottom:150px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:22px;direction:ltr}
#brand .logo{width:110px;height:110px}#brand .lt{font-size:36px;padding-bottom:6px}
#brand .h{font:700 40px Cairo;color:rgba(255,255,255,.7)}
#bigLogo{width:330px;height:330px;margin-bottom:50px}#bigLogo .lt{font-size:96px;padding-bottom:16px}
</style>
</head>
<body>
<div id="bg"></div>
<div id="tag"><span id="tagtxt"></span></div>
<div id="L1" class="layer"><div class="hook" id="hook"></div></div>
<div id="L2" class="layer"><div class="emoji" id="emoji"></div><div class="big" id="big"></div><div class="fact" id="fact"></div></div>
<div id="L3" class="layer"><div class="detail" id="detail"></div></div>
<div id="L4" class="layer"><div class="logo" id="bigLogo"><div class="spin" style="width:100%;height:100%"><svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe29a"/><stop offset="1" stop-color="#f4a300"/></linearGradient></defs><g class="teeth"><path d="M177.0,87.6 L195.3,88.7 L195.3,111.3 L177.0,112.4 L172.9,127.8 L188.2,137.9 L176.9,157.4 L160.5,149.2 L149.2,160.5 L157.4,176.9 L137.9,188.2 L127.8,172.9 L112.4,177.0 L111.3,195.3 L88.7,195.3 L87.6,177.0 L72.2,172.9 L62.1,188.2 L42.6,176.9 L50.8,160.5 L39.5,149.2 L23.1,157.4 L11.8,137.9 L27.1,127.8 L23.0,112.4 L4.7,111.3 L4.7,88.7 L23.0,87.6 L27.1,72.2 L11.8,62.1 L23.1,42.6 L39.5,50.8 L50.8,39.5 L42.6,23.1 L62.1,11.8 L72.2,27.1 L87.6,23.0 L88.7,4.7 L111.3,4.7 L112.4,23.0 L127.8,27.1 L137.9,11.8 L157.4,23.1 L149.2,39.5 L160.5,50.8 L176.9,42.6 L188.2,62.1 L172.9,72.2 Z" fill="url(#gg)"/></g><circle cx="100" cy="100" r="62" fill="#0b0f1a"/><circle cx="100" cy="100" r="62" fill="none" stroke="url(#gg)" stroke-width="5"/></svg></div><div class="lt">ترس</div></div><div class="cta1" id="cta"></div><div class="cta2">@taras_saudi</div></div>
<div id="brand"><div class="logo" id="smallLogo"><div class="spin" style="width:100%;height:100%"><svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe29a"/><stop offset="1" stop-color="#f4a300"/></linearGradient></defs><g class="teeth"><path d="M177.0,87.6 L195.3,88.7 L195.3,111.3 L177.0,112.4 L172.9,127.8 L188.2,137.9 L176.9,157.4 L160.5,149.2 L149.2,160.5 L157.4,176.9 L137.9,188.2 L127.8,172.9 L112.4,177.0 L111.3,195.3 L88.7,195.3 L87.6,177.0 L72.2,172.9 L62.1,188.2 L42.6,176.9 L50.8,160.5 L39.5,149.2 L23.1,157.4 L11.8,137.9 L27.1,127.8 L23.0,112.4 L4.7,111.3 L4.7,88.7 L23.0,87.6 L27.1,72.2 L11.8,62.1 L23.1,42.6 L39.5,50.8 L50.8,39.5 L42.6,23.1 L62.1,11.8 L72.2,27.1 L87.6,23.0 L88.7,4.7 L111.3,4.7 L112.4,23.0 L127.8,27.1 L137.9,11.8 L157.4,23.1 L149.2,39.5 L160.5,50.8 L176.9,42.6 L188.2,62.1 L172.9,72.2 Z" fill="url(#gg)"/></g><circle cx="100" cy="100" r="62" fill="#0b0f1a"/><circle cx="100" cy="100" r="62" fill="none" stroke="url(#gg)" stroke-width="5"/></svg></div><div class="lt">ترس</div></div><div class="h">@taras_saudi</div></div>
<div id="bar"></div>
<script>
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
let D, words=[], T;
function setup(d){
  D=d; const p=d.palette;
  const bg=document.getElementById('bg');
  bg.style.background=`radial-gradient(120% 80% at 50% 0%, ${p[0]}33, #0b0f1a 70%)`;
  bg.innerHTML=[0,1,2].map(i=>`<div class="blob" id="b${i}" style="width:${700+i*150}px;height:${700+i*150}px;background:${p[i]}"></div>`).join('');
  document.getElementById('tagtxt').textContent=d.tag;
  document.getElementById('hook').innerHTML=d.hook;
  document.getElementById('emoji').textContent=d.emoji;
  document.getElementById('big').textContent=d.big;document.getElementById('big').style.display=d.big?'':'none';
  let hl=false;document.getElementById('fact').innerHTML=d.fact.split(' ').map(w=>{const st=w.startsWith('*'),en=w.endsWith('*');if(st)hl=true;const c=hl?'w hl':'w';w=w.replace(/\*/g,'');if(en)hl=false;return `<span class="${c}">${w}</span>`}).join(' ');
  words=[...document.querySelectorAll('.fact .w')];
  document.getElementById('detail').innerHTML=d.detail;
  document.getElementById('cta').innerHTML=d.cta;
  T={hook:[0,2.6],fact:[2.6,9.6],detail:[9.6,14.2],cta:[14.2,d.duration]};
}
function show(id,t,[a,b],inDur=.45,outDur=.35){
  const el=document.getElementById(id);
  const i=ease((t-a)/inDur), o=b>=D.duration?0:ease((t-(b-outDur))/outDur);
  const v=clamp(i-o);
  el.style.opacity=v;
  el.style.transform=`translateY(${(1-i)*80 - o*80}px) scale(${.92+.08*i})`;
  return v;
}
function render(t){
  for(let i=0;i<3;i++){
    const b=document.getElementById('b'+i);
    const x=50+Math.sin(t*.35+i*2.1)*35, y=30+i*25+Math.cos(t*.28+i*1.3)*15;
    b.style.left=`calc(${x}% - ${350+i*75}px)`; b.style.top=`calc(${y}% - ${350+i*75}px)`;
  }
  const tag=document.getElementById('tag'); tag.style.opacity=ease(t/.5);
  // hook: punchy scale-in + shake
  const h=show('L1',t,T.hook,.35);
  const hk=document.getElementById('hook');
  const pop=back((t-T.hook[0])/.5);
  hk.style.transform=`scale(${.5+.5*pop}) rotate(${Math.sin(t*28)*Math.max(0,1.2-t)*2}deg)`;
  // fact
  show('L2',t,T.fact,.4);
  const lt=t-T.fact[0];
  const em=document.getElementById('emoji');
  em.style.transform=`scale(${back(lt/.6)}) translateY(${Math.sin(t*2.2)*14}px)`;
  const bg=document.getElementById('big');
  bg.style.transform=`scale(${back((lt-.35)/.5)})`; bg.style.opacity=clamp((lt-.35)/.25);
  const per=Math.min(.22, 4.2/Math.max(words.length,1));
  words.forEach((w,k)=>{const s=clamp((lt-.9-k*per)/.3);w.style.opacity=s;w.style.transform=`translateY(${(1-ease(s))*40}px)`;});
  // detail
  show('L3',t,T.detail,.45);
  // cta
  const c=show('L4',t,T.cta,.4);
  document.querySelector('#bigLogo .spin').style.transform=`rotate(${t*40}deg)`;
  document.getElementById('bigLogo').style.transform=`scale(${back((t-T.cta[0])/.6)})`;
  document.querySelector('#smallLogo .spin').style.transform=`rotate(${t*25}deg)`;
  document.getElementById('brand').style.opacity=1-c;
  document.getElementById('bar').style.width=(t/D.duration*100)+'%';
}
</script>
</body>
</html>
